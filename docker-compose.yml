services:
  hypersignal-http:
    build: .
    image: hypersignal-mcp:latest
    restart: unless-stopped
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      # Remote server exposes free + premium only (trading is stdio-only, always off here).
      HL_ENABLE_TRADING: "false"
      HYPERSIGNAL_DB_PATH: /app/data/hypersignal.db
    volumes:
      - hypersignal-data:/app/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  hypersignal-data:
