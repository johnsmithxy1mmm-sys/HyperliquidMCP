name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Allow running manually from the Actions tab.
  workflow_dispatch:

jobs:
  build:
    name: Typecheck, build & test
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # Supported range per package.json engines (">=20 <23").
        node-version: [20.x, 22.x]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      # npm ci installs strictly from the committed lockfile (reproducible).
      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Typecheck (strict)
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Test
        run: npm test
